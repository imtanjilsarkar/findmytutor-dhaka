<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Posts - FindmyTutor Dhaka</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F8F9FC; color: #1E293B; }
        
        .navbar {
            background: #FFFFFF;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.05);
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #1A2A6C, #F5A623); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
        .logo-text { font-size: 1.4rem; font-weight: 700; color: #1A2A6C; }
        .logo-text span { color: #F5A623; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { text-decoration: none; color: #475569; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: #F5A623; }
        
        .admin-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #1A2A6C, #243594);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 999;
            text-decoration: none;
        }
        .admin-fab:hover { transform: scale(1.1); background: #F5A623; }
        
        .page-header { padding: 8rem 5% 3rem; text-align: center; }
        .page-header h1 { font-size: 2.5rem; color: #1A2A6C; }
        
        .tuition-grid { padding: 2rem 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem; }
        
        .tuition-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #E2E8F0;
            transition: all 0.3s;
        }
        .tuition-card:hover { transform: translateY(-5px); border-color: #F5A623; }
        
        .salary-badge {
            display: inline-block;
            background: linear-gradient(135deg, #1A2A6C, #243594);
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .class-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #F5A623;
            margin-bottom: 0.5rem;
        }
        
        .subject-tag {
            display: inline-block;
            background: rgba(245,166,35,0.1);
            color: #F5A623;
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            margin: 0 4px 4px 0;
        }
        
        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            font-size: 0.85rem;
            color: #475569;
        }
        .info-row i { width: 18px; color: #F5A623; }
        
        .interested-btn {
            width: 100%;
            background: linear-gradient(135deg, #1A2A6C, #243594);
            border: none;
            padding: 12px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        
        .footer {
            background: #1A2A6C;
            color: #CBD5E1;
            padding: 3rem 5% 1.5rem;
            margin-top: 3rem;
            text-align: center;
        }
        
        .loading, .error { text-align: center; padding: 3rem; }
        .error { color: #ef4444; }
        
        @media (max-width: 768px) {
            .tuition-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">
        <div class="logo-icon">F</div>
        <span class="logo-text">FindmyTutor <span>Dhaka</span></span>
    </a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="tuition.html" class="active">Tuition Posts</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<a href="https://forms.gle/4NifvjzPgk47z1877" target="_blank" class="admin-fab">
    <i class="fas fa-plus"></i>
</a>

<div class="page-header">
    <h1>📚 Tuition Posts</h1>
    <p>Find the latest tuition opportunities in Dhaka</p>
</div>

<div class="tuition-grid" id="tuitionGrid">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading posts...</div>
</div>

<footer class="footer">
    <p>&copy; 2024 FindmyTutor Dhaka | Trusted Tuition Media in Bangladesh</p>
</footer>

<script>
    // REPLACE WITH YOUR ACTUAL API URL AFTER DEPLOYMENT
    const API_URL = "https://script.google.com/macros/s/AKfycbzyOFfwCLEd49PIIu730h52pXDwXzYrR43AeU6ulvQF9zyBRusDbNRv70DSX7n8_MUzKw/exec";
    
    async function loadPosts() {
        const grid = document.getElementById('tuitionGrid');
        
        try {
            console.log("Fetching from:", API_URL);
            const response = await fetch(API_URL);
            const posts = await response.json();
            
            console.log("Received:", posts);
            
            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="loading">📭 No tuition posts available. Check back soon!</div>';
                return;
            }
            
            grid.innerHTML = '';
            
            posts.forEach(post => {
                // Calculate time ago
                let timeAgo = "Recently";
                if (post.timestamp) {
                    const postDate = new Date(post.timestamp);
                    const now = new Date();
                    const hours = Math.floor((now - postDate) / 3600000);
                    if (hours < 1) timeAgo = "Just now";
                    else if (hours < 24) timeAgo = hours + " hours ago";
                    else timeAgo = Math.floor(hours / 24) + " days ago";
                }
                
                // Split subjects
                const subjectsList = post.subjects ? post.subjects.split(',').map(s => s.trim()) : [];
                
                const card = document.createElement('div');
                card.className = 'tuition-card';
                card.innerHTML = `
                    <div class="salary-badge"><i class="fas fa-taka-sign"></i> ${post.salaryRange || 'Negotiable'}</div>
                    <div class="class-name"><i class="fas fa-graduation-cap"></i> ${post.className || post.classLevel || 'Class not specified'}</div>
                    <div style="margin: 10px 0;">
                        ${subjectsList.map(s => `<span class="subject-tag">${s}</span>`).join('')}
                    </div>
                    <div class="info-row"><i class="fas fa-map-marker-alt"></i> Area: ${post.area || 'Not specified'}</div>
                    <div class="info-row"><i class="fas fa-hourglass-half"></i> Duration: ${post.duration || 'Not specified'}</div>
                    <div class="info-row"><i class="fas fa-venus-mars"></i> Preference: ${post.gender || 'Any'} Tutor</div>
                    <div class="info-row"><i class="fas fa-clock"></i> Posted: ${timeAgo}</div>
                    <button class="interested-btn" onclick="applyNow('${post.className || post.classLevel}', '${post.subjects}', '${post.area}')">
                        <i class="fas fa-hand-point-right"></i> Interested - Apply Now
                    </button>
                `;
                grid.appendChild(card);
            });
            
        } catch(error) {
            console.error("Error:", error);
            grid.innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle"></i> Error loading posts. Please refresh.</div>';
        }
    }
    
    function applyNow(className, subjects, area) {
        const message = `Hi! I am interested in the tuition post for ${className} - ${subjects} in ${area}. Please share more details.`;
        window.open(`https://wa.me/8801991309741?text=${encodeURIComponent(message)}`, '_blank');
    }
    
    loadPosts();
</script>
</body>
</html>
